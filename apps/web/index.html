<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0A14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Human Design System</title>
    <script>
      // Applica tema e lingua salvati prima del primo paint (evita il lampo del tema sbagliato).
      (function () {
        try {
          var theme = localStorage.getItem('hd:theme');
          var lang = localStorage.getItem('hd:locale');
          var root = document.documentElement;
          if (theme === 'light' || theme === 'dark' || theme === 'system') {
            root.setAttribute('data-theme', theme);
            var dark =
              theme === 'dark' ||
              (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', dark ? '#0B0A14' : '#FAF7F2');
          }
          if (lang === 'it' || lang === 'en') root.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
